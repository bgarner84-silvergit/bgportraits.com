<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
    <!--
        "BG" monogram — the favicon mark reserved in docs/brand.md, drawn from
        the condensed Saira forms. Warm near-black on a light tab, bone on a
        dark tab. No plate; the letters are the mark.
    -->
    <text
        x="16.5"
        y="17"
        text-anchor="middle"
        dominant-baseline="central"
        font-family="'Saira Variable', 'Saira', 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif"
        font-size="22"
        font-weight="800"
        font-stretch="condensed"
        letter-spacing="-1.4"
        fill="#14110F">BG</text>
    <style>
        @media (prefers-color-scheme: dark) {
            text { fill: #F2EEE7; }
        }
    </style>
</svg>
